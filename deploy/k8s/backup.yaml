# Daily logical backup of the database (the review log is the training data).
# Runs at 20:00, before the node is switched off for the night; if the node was
# off at that time, Kubernetes starts the missed run at the next boot.
# Dumps are kept for 14 days on a separate volume; copying them off the node
# (e.g. to the EliteDesk) is a later step.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 20 * * *"
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 1800
      template:
        spec:
          enableServiceLinks: false
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18
              envFrom:
                - secretRef:
                    name: forglemmigej-db
              env:
                - name: PGHOST
                  value: postgres
              command:
                - sh
                - -c
                - |
                  set -eu
                  # A run missed while the node was off starts right after boot,
                  # often before PostgreSQL accepts connections: wait up to 5 minutes.
                  tries=0
                  until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2 >/dev/null; do
                    tries=$((tries + 1))
                    if [ "$tries" -ge 60 ]; then echo "postgres not ready after 5 minutes" >&2; exit 1; fi
                    sleep 5
                  done
                  rm -f /backups/*.part # left by interrupted runs (runs never overlap)
                  file="/backups/forglemmigej-$(date +%Y%m%d-%H%M%S).dump"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$file.part"
                  mv "$file.part" "$file"
                  find /backups -name 'forglemmigej-*.dump' -mtime +14 -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
