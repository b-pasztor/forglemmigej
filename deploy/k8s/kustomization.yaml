apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forglemmigej
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - backup.yaml
  - mlflow.yaml
  - training.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: forglemmigej
images:
  # deploy.sh sets the tags to the current git commit.
  - name: forglemmigej-api
    newTag: latest
  - name: forglemmigej-web
    newTag: latest
  - name: forglemmigej-trainer
    newTag: latest
