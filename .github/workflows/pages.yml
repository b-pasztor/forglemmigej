# The public model report on GitHub Pages: the static page from report/ plus
# the latest report.json, which the nightly job on the homelab commits to the
# public data repository b-pasztor/forglemmigej-report (the homelab is not
# reachable from here, so it pushes; its token can write only there).
# Runs when the page changes and every evening after the nightly job.
name: pages

on:
  push:
    branches: [main]
    paths: ["report/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "15 19 * * *" # after the 19:30 Zurich nightly job, summer and winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add the latest report data
        run: |
          curl -sSfL -o report/report.json             https://raw.githubusercontent.com/b-pasztor/forglemmigej-report/main/report.json
          python3 -c "import json; r = json.load(open('report/report.json')); print('report of', r['generated_at'])"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: report

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
