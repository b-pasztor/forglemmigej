# Hand-maintained corrections for the frequency-based word deck.
# The importer maps frequent word forms to Wiktionary entries automatically;
# these fix the cases where the automatic choice is wrong. Reviewed: top 500.
# Keys are quoted because TOML bare keys must be ASCII ("så").

# Word form -> part of speech to use (Wiktionary POS names: adv, conj, prep, ...).
[pos]
"en" = "article"   # "a, an", not the pronoun "one"
"så" = "adv"       # "so, then"
"til" = "prep"     # "to", not "until"
"nu" = "adv"       # "now"
"bare" = "adv"     # "just", not "if only"
"hvis" = "conj"    # "if", not "whose"

# Word form -> "lemma|pos" when the form belongs to a different dictionary entry.
[lemma]
"gør" = "gøre|verb"     # "does", not "barks" (gø)
"lad" = "lade|verb"     # "let!", not "truck bed"
"tag" = "tage|verb"     # "take!", not "roof"
"nok" = "nok|adv"       # "probably, enough"
"jo" = "jo|adv"         # "as you know" / contradicting "yes"
"hele" = "hel|adj"      # "whole", not "heal"
"bedre" = "god|adj"     # comparative of "good"
"bedste" = "god|adj"    # superlative of "good", not "grandmother"
"gode" = "god|adj"      # plural of "good"
"død" = "død|adj"       # "dead"
"nødt" = "nødt|adj"     # "være nødt til" = "have to"
"næste" = "næste|adj"   # "next", not "to tack"
"gange" = "gang|noun"   # "times", plural of "gang"
"slags" = "slags|adj"   # "kind, sort"
"ny" = "ny|adj"         # "new", not "new moon"
"sød" = "sød|adj"       # "sweet", not "whole milk"
"fejl" = "fejl|noun"    # "mistake"
"lader" = "lade|verb"   # "lets", not "barn"
"færdig" = "færdig|adj"  # "finished, ready", not an interjection
"egen" = "egen|adj"     # "own", not "the oak"
"fast" = "fast|adj"     # "firm, fixed"
"lyst" = "lyst|noun"    # "desire, wish"
"kære" = "kær|adj"      # "dear"
"gift" = "gift|adj"     # "married", not "poison"
"kort" = "kort|adj"     # "short"
"stykke" = "stykke|noun"  # "piece"
"chance" = "chance|noun"
"kæreste" = "kæreste|noun"  # "boyfriend, girlfriend"
"fri" = "fri|adj"       # "free"
"øje" = "øje|noun"      # "eye"
"øjne" = "øje|noun"     # "eyes"
"små" = "lille|adj"     # plural of "small"
"mindre" = "lille|adj"  # comparative of "small"
"vis" = "vise|verb"     # "show!"
"læg" = "lægge|verb"    # "put!", not "calf"
"holdt" = "holde|verb"  # "held"
"givet" = "give|verb"   # "given"
"herre" = "herre|noun"  # "gentleman, lord"
"huset" = "hus|noun"    # "the house", not a participle of "huse"
"hænder" = "hånd|noun"  # "hands"
"søde" = "sød|adj"      # plural of "sweet"

# Lemma key -> display corrections.
[fix."mangen|adj"]
danish = "mange"
english = "many"

[fix."gang|noun"]
english = "time (occasion) / walk"

[fix."lide|verb"]
english = "to like (kunne lide) / to suffer"

[fix."nødt|adj"]
english = "forced (være nødt til = to have to)"

[fix."luk|verb"]
danish = "lukke"
english = "to close, shut"

[fix."forbi|prep"]
english = "past, by / over, finished"

[fix."kæreste|noun"]
english = "boyfriend, girlfriend"

[fix."forældre|noun"]
english = "parents"

[fix."rejse|verb"]
english = "to travel / to rise"

[fix."tøj|noun"]
english = "clothes, clothing"

[fix."masse|noun"]
english = "a lot, lots / mass"

[fix."passe|verb"]
english = "to fit / to look after"

# Lemma key -> English words that confirm the meaning in an example translation.
# Needed where English inflects irregularly or the gloss is too generic.
[meaning]
"være|verb" = ["be", "is", "am", "are", "was", "were", "been", "being"]
"have|verb" = ["have", "has", "had", "having", "got"]
"gøre|verb" = ["do", "does", "did", "done", "doing", "make", "made"]
"gå|verb" = ["go", "goes", "went", "gone", "going", "walk"]
"komme|verb" = ["come", "comes", "came", "coming", "get"]
"se|verb" = ["see", "sees", "saw", "seen", "seeing", "look", "looks", "looked", "looking"]
"sige|verb" = ["say", "says", "said", "saying", "tell", "told"]
"tage|verb" = ["take", "takes", "took", "taken", "taking"]
"give|verb" = ["give", "gives", "gave", "given", "giving"]
"få|verb" = ["get", "gets", "got", "gotten", "getting", "have", "receive"]
"vide|verb" = ["know", "knows", "knew", "known"]
"ved|prep" = ["at", "by", "next to"]  # "on" matches "going on", "near" matches "nearly"
"blive|verb" = ["become", "becomes", "became", "get", "got", "stay", "be", "is", "was", "will"]

[exclude]
# Word forms left out of the deck: swear words, and forms without a usable entry.
words = [
    "fanden", "helvede", "lort", "pis", "kæft", "sgu", "røven", "sex",  # swearing, vulgar
    "galt", "oppe", "passer",  # no usable entry for the common meaning
    "the", "live",  # English words from subtitles
]
