apiVersion: v1
kind: Service
metadata:
  name: api # web/nginx.conf proxies /api to http://api:8000
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Kubernetes would inject POSTGRES_PORT=tcp://... for the postgres Service,
      # which clashes with our POSTGRES_* settings. Services are found via DNS.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: migrate # schema migrations run before every new version starts
          image: forglemmigej-api
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: forglemmigej-db
          env:
            - name: POSTGRES_HOST
              value: postgres
      containers:
        - name: api
          image: forglemmigej-api
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: forglemmigej-db
          env:
            - name: POSTGRES_HOST
              value: postgres
          ports:
            - containerPort: 8000
          lifecycle:
            # During a rollout, traffic can still reach a pod that is shutting
            # down until the endpoint update has propagated; keep serving briefly.
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
