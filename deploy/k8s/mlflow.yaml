# MLflow tracking server: every nightly run (data summary, model evaluation,
# fitted parameters) is recorded here. SQLite is enough for a single writer;
# artifacts are served by the server itself, so jobs only need HTTP access.
# UI from the laptop: kubectl -n forglemmigej port-forward svc/mlflow 5000:5000
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite: never two servers on the same file
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      enableServiceLinks: false
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.16.1
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --serve-artifacts
            # MLflow rejects unknown Host headers (DNS rebinding protection).
            - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1:5000
          env:
            - name: MLFLOW_DISABLE_AGENT_HINT
              value: "1"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /mlflow
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow
