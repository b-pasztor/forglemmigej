# Local development services. During development the API and the web app run
# on the host (uv / npm); only PostgreSQL runs here.
#
# The "app" profile runs the production images locally, to test them before
# deploying (against a separate database, so test reviews never mix with real ones):
#   docker compose --profile app up --build    ->  http://localhost:8080
name: forglemmigej

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: forglemmigej_container
  POSTGRES_USER: ${POSTGRES_USER:-forglemmigej}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forglemmigej}
      POSTGRES_USER: ${POSTGRES_USER:-forglemmigej}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  create-container-db:
    profiles: [app]
    image: postgres:18
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -h postgres -U ${POSTGRES_USER:-forglemmigej} -d postgres -tc
        "SELECT 1 FROM pg_database WHERE datname = 'forglemmigej_container'" | grep -q 1
        || psql -h postgres -U ${POSTGRES_USER:-forglemmigej} -d postgres
        -c "CREATE DATABASE forglemmigej_container"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: api/Dockerfile }
    image: forglemmigej-api:local
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      create-container-db:
        condition: service_completed_successfully

  api:
    profiles: [app]
    image: forglemmigej-api:local
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [app]
    build: web
    image: forglemmigej-web:local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [api]

volumes:
  postgres-data:
