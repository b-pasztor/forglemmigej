# Deployment artifacts: the Kubernetes manifests must render and validate, and
# the container images must build. Images are not pushed: deploy.sh builds and
# loads them into the homelab's k3s, which a hosted runner cannot reach.
name: deploy

on:
  push:
    branches: [main]
    paths: ["deploy/**", "api/**", "web/**", "data/curation/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["deploy/**", "api/**", "web/**", "data/curation/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render with kustomize and validate against the Kubernetes schemas
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          kubectl kustomize deploy/k8s > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml
          ./kubeconform -strict -summary deploy/jobs/*.yaml
      - name: Check the shell scripts
        run: shellcheck deploy/*.sh

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, file: api/Dockerfile, target: api, context: . }
          - { image: trainer, file: api/Dockerfile, target: trainer, context: . }
          - { image: web, file: web/Dockerfile, target: "", context: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: forglemmigej-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
